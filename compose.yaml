services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmscript
      POSTGRES_USER: farmscript
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copiez .env.example vers .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - farmscript-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U farmscript -d farmscript"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  farmscript-postgres:
